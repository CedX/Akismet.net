name: ContinuousIntegration
on: push

jobs:
  Test:
    runs-on: windows-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10
      - name: Run tests
        run: dotnet Scripts/Test.cs
        env:
          AKISMET_API_KEY: ${{secrets.AKISMET_API_KEY}}
